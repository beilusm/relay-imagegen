<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片工作台 · Relay</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#10141c;color:#e5ebf6}*{box-sizing:border-box}body{margin:0}header{padding:24px 32px;border-bottom:1px solid #30394a;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0 0 6px}p{color:#a6b4ca;margin:0}main{max-width:1600px;margin:auto;padding:24px 32px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}button,select{background:#253145;color:#edf2ff;border:1px solid #46546b;border-radius:8px;padding:10px 14px}button{cursor:pointer}button.primary{background:#355bd8;border-color:#5f7de6}button:disabled{opacity:.5;cursor:wait}label{display:flex;align-items:center;gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#181f2b;border:1px solid #30394a;border-radius:12px;padding:16px;min-width:0}.panel h2{font-size:16px;margin:0 0 12px}.stage{position:relative;display:block;line-height:0;background:repeating-conic-gradient(#222b39 0% 25%,#1a2230 0% 50%) 50%/24px 24px}.stage img{width:100%;height:auto;display:block}.stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.compare{width:100%;max-height:65vh;object-fit:contain;background:#10141c}#status{margin-top:18px;white-space:pre-wrap;overflow-wrap:anywhere;color:#c5d3eb;line-height:1.7}.hint{margin-top:12px;font-size:13px;line-height:1.6}.tag{font-size:12px;letter-spacing:1px;color:#9eb8ff}input[type=range]{width:110px}details{margin-top:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#aebed5}#error{color:#ffb5af} @media(max-width:800px){.grid{grid-template-columns:1fr}header,main{padding:20px}.toolbar{gap:8px}}
</style>
<header><div><h1>图片工作台</h1><p>比较版本，选择结果，涂抹需要修改的区域。</p></div><span class="tag">RELAY / LOCAL</span></header>
<main><div class="toolbar"><label>编辑版本 <select id="version" aria-label="编辑版本"></select></label><button id="select">设为当前版本</button><button id="refresh">刷新记录</button><span id="selected"></span></div>
<div class="grid"><section class="panel"><h2>编辑区域</h2><div class="toolbar"><label>笔刷 <input id="brush" type="range" min="5" max="180" value="45" aria-label="笔刷大小"></label><label><input id="erase" type="checkbox">擦除选区</label><button id="undo">撤销笔画</button><button id="clear">清空</button></div><div class="stage"><img id="base" alt="当前编辑版本"><canvas id="paint" aria-label="涂抹需要修改的区域"></canvas></div><p class="hint">红色区域将导出为透明蒙版。原图保持不变，保存蒙版不会提交生成请求。</p><div class="toolbar" style="margin-top:16px"><button class="primary" id="save">保存蒙版</button><button id="download">下载蒙版</button></div></section>
<section class="panel"><h2>版本对比</h2><div class="toolbar"><label>对比版本 <select id="compareVersion" aria-label="对比版本"></select></label></div><img id="compare" class="compare" alt="对比版本"><details><summary>查看版本记录</summary><pre id="metadata"></pre></details></section></div><p id="error" role="alert"></p><div id="status" role="status">正在读取本地版本…</div></main>
<script>
const $=id=>document.getElementById(id), token=new URL(location.href).searchParams.get('token');
const endpoint=(path,params={})=>path+'?'+new URLSearchParams({token,...params});
let state, strokes=[], active=null, loadedRevision=null, loadEpoch=0;
const canvas=$('paint'), ctx=canvas.getContext('2d');
async function api(path,body){const response=await fetch(endpoint(path),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'操作失败');return data;}
function guarded(fn){return async()=>{try{$('error').textContent='';await fn();}catch(e){$('error').textContent=e.message;}}}
function paint(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of strokes){ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';ctx.strokeStyle='rgba(255,74,95,0.55)';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(...s.points[0]);for(const p of s.points.slice(1))ctx.lineTo(...p);ctx.stroke();if(s.points.length===1){ctx.beginPath();ctx.arc(...s.points[0],s.width/2,0,Math.PI*2);ctx.fill();}}ctx.globalCompositeOperation='source-over';}
function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width*canvas.width,(e.clientY-r.top)/r.height*canvas.height];}
canvas.onpointerdown=e=>{if(!loadedRevision)return;canvas.setPointerCapture(e.pointerId);active={erase:$('erase').checked,width:Number($('brush').value)*canvas.width/canvas.getBoundingClientRect().width,points:[point(e)]};strokes.push(active);paint();};
canvas.onpointermove=e=>{if(active){active.points.push(point(e));paint();}};
canvas.onpointerup=canvas.onpointercancel=()=>{active=null;};
$('undo').onclick=()=>{strokes.pop();paint();};$('clear').onclick=()=>{strokes=[];paint();};
async function loadBase(){const epoch=++loadEpoch;loadedRevision=null;$('save').disabled=true;$('download').disabled=true;const rev=$('version').value;const image=new Image();image.src=endpoint('/api/image',{revision:rev});await image.decode();if(epoch!==loadEpoch)return;$('base').src=image.src;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;strokes=[];paint();loadedRevision=Number(rev);$('save').disabled=false;$('download').disabled=false;}
function compare(){const rev=$('compareVersion').value;$('compare').src=endpoint('/api/image',{revision:rev});$('metadata').textContent=JSON.stringify(state.revisions[Number(rev)-1],null,2);}
async function refresh(){state=await api('/api/state');for(const id of ['version','compareVersion']){const select=$(id);select.replaceChildren();state.revisions.forEach((r,i)=>{const option=document.createElement('option');option.value=i+1;option.textContent=`版本 ${i+1} · 图片 ${r.image_index}`;select.append(option);});select.value=(state.selected??0)+1;}$('selected').textContent=state.selected===null?'尚未选择':`当前：版本 ${state.selected+1}`;if(state.revisions.length){await loadBase();compare();$('status').textContent=`共 ${state.revisions.length} 个版本。选择两张图片可并排比较。`;}else{$('status').textContent='此会话尚无图片。';$('save').disabled=true;}}
function mask(){if(!loadedRevision||!strokes.length)throw Error('请先涂抹需要修改的区域。');const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const c=out.getContext('2d');c.fillStyle='white';c.fillRect(0,0,out.width,out.height);const marks=ctx.getImageData(0,0,canvas.width,canvas.height), pixels=c.getImageData(0,0,out.width,out.height);let count=0;for(let i=3;i<marks.data.length;i+=4){if(marks.data[i]>0){pixels.data[i]=0;count++;}}if(!count)throw Error('当前没有可编辑区域。');c.putImageData(pixels,0,0);return out;}
$('version').onchange=guarded(loadBase);$('compareVersion').onchange=compare;$('refresh').onclick=guarded(refresh);
$('select').onclick=guarded(async()=>{await api('/api/select',{revision:Number($('version').value)});$('selected').textContent=`当前：版本 ${$('version').value}`;$('status').textContent='后续 edit --session 将使用此版本。';});
$('save').onclick=guarded(async()=>{const png=mask().toDataURL('image/png').split(',')[1];const data=await api('/api/mask',{revision:loadedRevision,png});$('status').textContent=`蒙版已保存：${data.mask}\n用于 edit 的参数：\n--from-run ${JSON.stringify(data.from_run)}\n--image-index ${data.image_index}\n--mask ${JSON.stringify(data.mask)}\n请在后续指令中描述要改变的内容。`;});
$('download').onclick=guarded(async()=>{const out=mask();const a=document.createElement('a');a.href=out.toDataURL('image/png');a.download=`mask-version-${loadedRevision}.png`;a.click();});
guarded(refresh)();
</script></html>
